name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore RestaurantOrder.slnx

      - name: Format check
        run: dotnet format RestaurantOrder.slnx --verify-no-changes

      - name: Build
        run: dotnet build RestaurantOrder.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/RestaurantOrder.UnitTests --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Integration tests
        run: dotnet test tests/RestaurantOrder.IntegrationTests --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/coverage.cobertura.xml"
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restaurantorder-api:ci .

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL'
          format: 'table'

      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'restaurantorder-api:ci'
          exit-code: '1'
          severity: 'CRITICAL'
          format: 'table'

  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORG: ${{ secrets.SONAR_ORG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        if: env.SONAR_TOKEN != ''
        run: dotnet restore RestaurantOrder.slnx

      - name: SonarCloud begin
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${{ secrets.SONAR_PROJECT_KEY }}"
          /o:"${{ secrets.SONAR_ORG }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"

      - name: Build
        if: env.SONAR_TOKEN != ''
        run: dotnet build RestaurantOrder.slnx --no-restore

      - name: SonarCloud end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
