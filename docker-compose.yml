services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=restaurantorder;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine AS builder
        RUN apk add --no-cache libc6-compat git
        WORKDIR /app
        RUN git clone --depth 1 https://github.com/Shiro-Momon/The-Dinner-Front.git .
        RUN npm install
        RUN sed -i 's|http://localhost:8080|http://api:8080|g' next.config.ts \
         && sed -i 's|const nextConfig: NextConfig = {|const nextConfig: NextConfig = { output: "standalone",|' next.config.ts
        RUN npm run build

        FROM node:20-alpine AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        ENV HOSTNAME=0.0.0.0
        ENV PORT=3001
        COPY --from=builder /app/.next/standalone ./
        COPY --from=builder /app/.next/static ./.next/static
        COPY --from=builder /app/public ./public
        EXPOSE 3001
        CMD ["node", "server.js"]
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurantorder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadb:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafanadb:
